[project]
name = "aerisvault-ui"
version = "0.1.0"
description = "Thin UI shell for AerisVault simulation post-processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "dynaprocessing",  # Will be installed as editable
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aerisvault*"]
